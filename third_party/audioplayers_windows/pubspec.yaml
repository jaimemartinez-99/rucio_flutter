name: audioplayers_windows
description: Windows implementation of audioplayers with platform thread event delivery.
version: 4.4.1+rucio.1
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: audioplayers
    platforms:
      windows:
        pluginClass: AudioplayersWindowsPlugin

dependencies:
  audioplayers_platform_interface: ^7.2.0
  flutter:
    sdk: flutter
